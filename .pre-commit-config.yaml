repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: (^|/)tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-api
        name: ruff (api)
        entry: bash -c 'cd api && .venv/bin/ruff check .'
        language: system
        files: ^api/
        pass_filenames: false

      - id: mypy-api
        name: mypy (api)
        entry: bash -c 'cd api && .venv/bin/mypy .'
        language: system
        files: ^api/
        pass_filenames: false

      - id: ruff-tools
        name: ruff (tools)
        entry: bash -c 'cd tools && .venv/bin/ruff check .'
        language: system
        files: ^tools/
        pass_filenames: false

      - id: mypy-tools
        name: mypy (tools)
        entry: bash -c 'cd tools && .venv/bin/mypy .'
        language: system
        files: ^tools/
        pass_filenames: false

      - id: eslint-web
        name: eslint (web)
        entry: bash -c 'cd web && npm run -s lint'
        language: system
        files: ^web/
        pass_filenames: false

      - id: vue-tsc-web
        name: vue-tsc (web)
        entry: bash -c 'cd web && npm run -s typecheck'
        language: system
        files: ^web/
        pass_filenames: false

      - id: eslint-infra
        name: eslint (infra)
        entry: bash -c 'cd infra && npm run -s lint'
        language: system
        files: ^infra/
        pass_filenames: false

      - id: tsc-infra
        name: tsc (infra)
        entry: bash -c 'cd infra && npm run -s typecheck'
        language: system
        files: ^infra/
        pass_filenames: false
