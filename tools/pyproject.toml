[project]
name = "flourish-tools"
version = "0.1.0"
description = "Flourish Studio 運用スクリプト（記事投入、静的サイト生成）"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
