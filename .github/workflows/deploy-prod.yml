name: Deploy (prod)

on:
  push:
    tags: ["v*"]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    # このEnvironmentにRequired reviewersを設定することで、タグpush後もデプロイ実行前に人の承認を挟む。
    # Environment自体の作成とレビュアー設定はGitHubリポジトリ側の設定（私）で行う。
    environment: production
    # OIDCでAWSの一時credentialsを取得する(長期のaccess keyをGitHub Secretsに置かない。P7-10)。
    # ロール自体の作成・信頼ポリシーの設定はAWSコンソール/CLIでの人の作業(私)。
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - run: make setup
      - run: make lint
      - run: make test
      - run: make deploy-prod
