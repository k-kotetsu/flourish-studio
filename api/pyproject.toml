[project]
name = "flourish-api"
version = "0.1.0"
description = "Flourish Studio API (FastAPI, Lambda Web Adapter)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["app", "tests"]
strict = true
warn_unused_ignores = true
